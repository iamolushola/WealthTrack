name: CI

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run api:build

      - name: Build worker
        run: npm run worker:build

      - name: Build dashboard
        run: npm run dashboard:build