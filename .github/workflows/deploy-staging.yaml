name: Deploying to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: Redeploy even if SHA matches current staging tag
        type: boolean
        default: false

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VESTA_APP_API: wealthtrack-api
  VESTA_APP_WORKER: wealthtrack-worker
  VESTA_APP_DASHBOARD: wealthtrack-dashboard
  SWR_REGISTRY: swr.af-south-1.myhuaweicloud.com
  SWR_NAMESPACE: credpal-prod
  STAGING_URL: https://wealthtrack-staging.credpal.xyz
  HEALTH_PATH: /api/v1/health/live

jobs:
  validate:
    name: Type-check & compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Compile all apps
        run: |
          npm run api:build
          npm run worker:build
          npm run dashboard:build
      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          IMAGE_TAG="staging-${SHORT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          { echo "### Validate"; echo "- IMAGE_TAG: \`${IMAGE_TAG}\`"; echo "- sha: \`${GITHUB_SHA}\`"; } >> "$GITHUB_STEP_SUMMARY"

  build-api:
    name: Build & push API image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ needs.validate.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: huaweicloud/swr-login@v2.1.0
        with:
          access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ACCESS_KEY_SECRET }}
          region: af-south-1

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/wealthtrack-api:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Summarise
        run: |
          { echo "### Build API"; echo "- \`${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/wealthtrack-api:${{ env.IMAGE_TAG }}\`"; } >> "$GITHUB_STEP_SUMMARY"

  build-worker:
    name: Build & push worker image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ needs.validate.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: huaweicloud/swr-login@v2.1.0
        with:
          access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ACCESS_KEY_SECRET }}
          region: af-south-1

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/wealthtrack-worker:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Summarise
        run: |
          { echo "### Build Worker"; echo "- \`${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/wealthtrack-worker:${{ env.IMAGE_TAG }}\`"; } >> "$GITHUB_STEP_SUMMARY"

  build-dashboard:
    name: Build & push dashboard image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ needs.validate.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: huaweicloud/swr-login@v2.1.0
        with:
          access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ACCESS_KEY_SECRET }}
          region: af-south-1

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/wealthtrack-dashboard:${{ env.IMAGE_TAG }}
          build-args: VITE_API_BASE_URL=${{ secrets.STAGING_VITE_API_BASE_URL }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Summarise
        run: |
          { echo "### Build Dashboard"; echo "- \`${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/wealthtrack-dashboard:${{ env.IMAGE_TAG }}\`"; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Vesta staging
    needs: [validate, build-api, build-worker, build-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      PREVIOUS_TAG: ${{ steps.snapshot.outputs.PREVIOUS_TAG }}
    env:
      VESTA_API_KEY: ${{ secrets.VESTA_STAGING_API_KEY }}
      IMAGE_TAG: ${{ needs.validate.outputs.IMAGE_TAG }}
      ENVIRONMENT: staging
      BASE_URL: https://k8.credpal.xyz
    steps:
      - name: Snapshot current Vesta tag (for rollback)
        id: snapshot
        run: |
          set -uo pipefail
          PREV=$(curl -fsS \
            -H "Authorization: Bearer $VESTA_API_KEY" \
            "${BASE_URL}/api/v1/apps/${VESTA_APP_API}/environments/${ENVIRONMENT}" \
            2>/dev/null | jq -r '.tag // empty' || echo "")
          if [ -z "$PREV" ]; then
            echo "::warning::Could not determine previous tag; rollback disabled."
          fi
          echo "PREVIOUS_TAG=${PREV}" >> "$GITHUB_OUTPUT"
          { echo "### Deploy"; echo "- Previous tag: \`${PREV:-unknown}\`"; echo "- New tag: \`${IMAGE_TAG}\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Vesta
        run: |
          set -euo pipefail
          vesta_deploy() {
            local app="$1"
            local http_code
            http_code=$(curl -sS -o /tmp/vesta_body -w "%{http_code}" -X POST \
              "${BASE_URL}/api/v1/apps/${app}/deploy" \
              -H 'accept: */*' \
              -H "Authorization: Bearer $VESTA_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"tag\": \"${IMAGE_TAG}\", \"environment\": \"${ENVIRONMENT}\"}")
            echo "${app}: HTTP ${http_code} — $(cat /tmp/vesta_body)"
            if [ "${http_code}" -ge 400 ]; then
              echo "::error::Vesta deploy failed for ${app} (HTTP ${http_code}): $(cat /tmp/vesta_body)"
              return 1
            fi
          }
          vesta_deploy "${VESTA_APP_API}"
          vesta_deploy "${VESTA_APP_WORKER}"
          vesta_deploy "${VESTA_APP_DASHBOARD}"
          { echo "- Deployed: \`${VESTA_APP_API}\`, \`${VESTA_APP_WORKER}\`, \`${VESTA_APP_DASHBOARD}\`"; } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Rollback on failure
    needs: [deploy]
    if: failure() && needs.deploy.result == 'success' && needs.deploy.outputs.PREVIOUS_TAG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VESTA_API_KEY: ${{ secrets.VESTA_STAGING_API_KEY }}
      PREV: ${{ needs.deploy.outputs.PREVIOUS_TAG }}
      ENVIRONMENT: staging
      BASE_URL: https://k8.credpal.xyz
    steps:
      - name: Re-deploy previous tag
        run: |
          set -euo pipefail
          vesta_deploy() {
            curl -fsS -X POST \
              "${BASE_URL}/api/v1/apps/${1}/deploy" \
              -H 'accept: */*' \
              -H "Authorization: Bearer $VESTA_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"tag\": \"${PREV}\", \"environment\": \"${ENVIRONMENT}\"}"
          }
          vesta_deploy "${VESTA_APP_API}"
          vesta_deploy "${VESTA_APP_WORKER}"
          vesta_deploy "${VESTA_APP_DASHBOARD}"
          { echo "### Rollback"; echo "- Reverted to: \`${PREV}\`"; } >> "$GITHUB_STEP_SUMMARY"


  notify:
    name: Notify
    needs: [validate, build-api, build-worker, build-dashboard, deploy, rollback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compose status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            STATUS="✅ Staging deployed"
          elif [ "${{ needs.rollback.result }}" = "success" ]; then
            STATUS="↩️ Staging deploy failed — rolled back"
          else
            STATUS="❌ Staging deploy failed — manual intervention required"
          fi
          echo "STATUS=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: Notify Google Chat
        uses: SimonScholz/google-chat-action@main # pinned to match order-pro
        with:
          webhookUrl: "${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}"
          title: "${{ steps.status.outputs.STATUS }} · wealthtrack (api, worker, dashboard)"
          jobStatus: "${{ job.status }}"
