name: Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: iamolushola
  IMAGE_TAG: staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/wealthtrack-api:${{ env.IMAGE_TAG }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/wealthtrack-worker:${{ env.IMAGE_TAG }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.STAGING_VITE_API_BASE_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/wealthtrack-dashboard:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Deploy to staging host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -eu
            cd /opt/wealthtrack-staging
            git fetch origin
            git checkout staging
            git reset --hard origin/staging
            docker login ghcr.io -u ${{ secrets.STAGING_GHCR_USERNAME }} -p ${{ secrets.STAGING_GHCR_TOKEN }}
            docker compose --env-file .env.staging -f infra/docker/docker-compose.staging.yml pull
            docker compose --env-file .env.staging -f infra/docker/docker-compose.staging.yml up -d
            COMPOSE_FILE=infra/docker/docker-compose.staging.yml sh infra/mysql/apply-migrations.sh