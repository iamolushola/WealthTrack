name: PR Validate • Staging

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

concurrency:
  group: staging-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Type-check & compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Compile all apps
        run: |
          npm run api:build
          npm run worker:build
          npm run dashboard:build
      - name: Job summary
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          { echo "### PR Validate"; echo "- pr: \`#${PR}\`"; echo "- sha: \`${SHA}\`"; } >> "$GITHUB_STEP_SUMMARY"

  build-api:
    name: Docker build check — API
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build API image (no push)
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=0
          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            -t wealthtrack-api:pr-check \
            -f apps/api/Dockerfile .

  build-worker:
    name: Docker build check — worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build worker image (no push)
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=0
          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            -t wealthtrack-worker:pr-check \
            -f apps/worker/Dockerfile .

  build-dashboard:
    name: Docker build check — dashboard
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build dashboard image (no push)
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=0
          docker build \
            --build-arg VITE_API_BASE_URL=https://placeholder.local/api/v1 \
            -t wealthtrack-dashboard:pr-check \
            -f apps/dashboard/Dockerfile .
